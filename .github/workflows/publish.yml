name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"

# The publish job escalates to id-token: write for OIDC; everything else
# stays read-only, and the create-release job scopes its contents: write to
# minting the Release from the tag's verbatim message.
permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Lint (the same pinned gates CI runs on main)
        run: |
          pip install ruff==0.15.20
          ruff check src tests scripts
          ruff format --check src tests scripts

      - name: Run test suite
        run: |
          pip install "git+https://github.com/VirInvictus/cquarry.git@main"
          pip install .
          PYTHONPATH=src python -m unittest discover -s tests

  build-and-publish:
    name: Build distribution and publish to PyPI
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/calibrequarry
    permissions:
      id-token: write # Required for OIDC authentication with PyPI

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install build
        run: python -m pip install --upgrade build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check the distribution metadata
        run: twine check --strict dist/*

      - name: Smoke-install the wheel
        run: |
          python -m venv .smoke
          .smoke/bin/pip install dist/*.whl
          .smoke/bin/python -c "import cquarry_cli; print('smoke ok')"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  create-release:
    name: Create the GitHub Release from the tag
    needs: build-and-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The job needs a clone for the local tag-object read below (gh's
      # --notes-from-tag is NOT used: inside Actions it silently falls back
      # to the commit message -- Catagotchi issue #2, ten damaged releases
      # over six weeks).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
      # checkout rewrites refs/tags/vX to the resolved commit SHA even after
      # its fetch (deadbeef-cui v2.0.1 precedent), so the annotated object
      # must be re-fetched --force right before it is read.
      - name: Fetch the annotated tag object
        env:
          TAG: ${{ github.ref_name }}
        run: git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
      - name: Mint the Release from the tag's verbatim message
        env:
          GH_TOKEN: ${{ github.token }}
        # Idempotent on the release existing: the standing tag procedure
        # mints the Release manually before this workflow reaches its last
        # step (v3.87.0, 2026-11-13), and `gh release create` refuses with
        # HTTP 422 "Release.tag_name already exists". An existing Release
        # is a success here, not a failure -- the tag's verbatim message is
        # either already rendered as the body or about to be. The probe
        # carries no --verify-tag: that flag belongs to `gh release
        # create` and is unknown to `gh release view`, so the 2026-11-13
        # guard always fell through and the v3.93.0 mint 422'd anyway.
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; nothing to mint."
            exit 0
          fi
          OT="$(git for-each-ref "refs/tags/$GITHUB_REF_NAME" --format='%(objecttype)')"
          if [ "$OT" != "tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME is $OT, not an annotated tag; the verbatim patchnotes entry is unavailable"
            exit 1
          fi
          git for-each-ref "refs/tags/$GITHUB_REF_NAME" --format='%(contents)' > /tmp/release-notes.md
          TITLE="$(head -1 /tmp/release-notes.md)"
          gh release create "$GITHUB_REF_NAME" --verify-tag --notes-file /tmp/release-notes.md --title "$TITLE"
