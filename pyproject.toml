[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "calibrequarry"
version = "3.12.0"
description = "Calibre library toolkit: catalog, stats, audit, export"
readme = "README.md"
requires-python = ">=3.14"
license = {text = "MIT"}
authors = [
  {name = "vrnvctss"}
]
dependencies = [
  "tqdm",
  "cquarry",]

[project.scripts]
cquarry = "cquarry_cli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cquarry_cli"]
