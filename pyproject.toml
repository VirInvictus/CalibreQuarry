[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "calibrequarry"
version = "3.26.0"
description = "Calibre library toolkit: catalog, stats, audit, export"
readme = "README.md"
requires-python = ">=3.14"
license = {text = "MIT"}
authors = [
  {name = "vrnvctss"}
]
dependencies = [
  "tqdm",
  "vir-tui>=2.2.0",
  "cquarry>=1.9.0",
]

[project.scripts]
cquarry = "cquarry_cli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cquarry_cli"]

[tool.ruff.lint]
ignore = ["PLW1510", "BLE001", "DTZ011", "SIM118", "S110", "C401", "DTZ005", "SIM115"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]



keywords = ["calibre", "ebooks", "library", "tui", "cli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console :: Curses",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
]
