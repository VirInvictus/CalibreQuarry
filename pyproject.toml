[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "calibrequarry"
version = "3.14.0"
description = "Calibre library toolkit: catalog, stats, audit, export"
readme = "README.md"
requires-python = ">=3.14"
license = {text = "MIT"}
authors = [
  {name = "vrnvctss"}
]
dependencies = [
  "tqdm",
   "vir-tui",
  "cquarry @ git+https://github.com/VirInvictus/cquarry.git",]

[project.scripts]
cquarry = "cquarry_cli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cquarry_cli"]

[tool.ruff.lint]
ignore = ["PLW1510", "BLE001", "DTZ011", "SIM118", "S110", "C401", "DTZ005", "SIM115"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
vir-tui = { git = "https://github.com/VirInvictus/vir-tui.git", branch = "main" }
