[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "calibrequarry"
version = "3.49.0"
description = "Calibre library toolkit: catalog, stats, audit, export"
readme = "README.md"
keywords = ["calibre", "ebooks", "library", "tui", "cli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console :: Curses",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]
requires-python = ">=3.14"
# PEP 639: the SPDX expression replaces the License classifier.
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "vrnvctss"}
]
dependencies = [
  "tqdm",
  "vir-tui>=2.5.0",
  "cquarry>=1.22.0",
]

[project.scripts]
cquarry = "cquarry_cli.cli:main"

[project.urls]
Homepage = "https://pypi.org/project/calibrequarry/"
Repository = "https://github.com/VirInvictus/CalibreQuarry"
Changelog = "https://github.com/VirInvictus/CalibreQuarry/blob/main/patchnotes.md"
Issues = "https://github.com/VirInvictus/CalibreQuarry/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/cquarry_cli"]

[tool.ruff.lint]
ignore = ["PLW1510", "BLE001", "DTZ011", "SIM118", "S110", "C401", "DTZ005", "SIM115"]




