<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- CalibreQuarry: the quarry wall. Book spines as a cut stone mass; one block extracted, chisel-notched, held above the wall. Kanagawa Dragon palette; no font dependencies. -->
  <rect x="0" y="0" width="512" height="512" rx="96" fill="#181616"/>

  <!-- the cut plane: one horizontal quarry cut through the whole wall -->
  <line x1="96" y1="300" x2="440" y2="300" stroke="#181616" stroke-width="6"/>

  <!-- ground -->
  <rect x="56" y="396" width="400" height="5" rx="2.5" fill="#625e5a" opacity="0.55"/>

  <!-- slab 1 -->
  <rect x="100" y="252" width="44" height="146" rx="4" fill="#282727"/>
  <line x1="110" y1="282" x2="134" y2="282" stroke="#181616" stroke-width="4" opacity="0.7"/>
  <line x1="110" y1="330" x2="134" y2="330" stroke="#181616" stroke-width="4" opacity="0.7"/>

  <!-- slab 2 (dim, with its own cut notch) -->
  <rect x="152" y="222" width="50" height="176" rx="4" fill="#625e5a" opacity="0.5"/>
  <line x1="163" y1="252" x2="191" y2="252" stroke="#181616" stroke-width="4" opacity="0.6"/>
  <line x1="163" y1="330" x2="191" y2="330" stroke="#181616" stroke-width="4" opacity="0.6"/>

  <!-- slab 4 -->
  <rect x="286" y="234" width="50" height="164" rx="4" fill="#282727"/>
  <line x1="297" y1="264" x2="325" y2="264" stroke="#181616" stroke-width="4" opacity="0.7"/>
  <line x1="297" y1="338" x2="325" y2="338" stroke="#181616" stroke-width="4" opacity="0.7"/>

  <!-- slab 5 (dim) -->
  <rect x="344" y="196" width="44" height="202" rx="4" fill="#625e5a" opacity="0.5"/>
  <line x1="354" y1="226" x2="378" y2="226" stroke="#181616" stroke-width="4" opacity="0.6"/>
  <line x1="354" y1="330" x2="378" y2="330" stroke="#181616" stroke-width="4" opacity="0.6"/>

  <!-- slab 6 -->
  <rect x="396" y="268" width="40" height="130" rx="4" fill="#282727"/>
  <line x1="405" y1="330" x2="427" y2="330" stroke="#181616" stroke-width="4" opacity="0.7"/>

  <!-- chips fallen into the gap under the lifted block -->
  <rect x="226" y="378" width="13" height="13" rx="2" fill="#c4b28a" opacity="0.5" transform="rotate(24 232.5 384.5)"/>
  <rect x="270" y="382" width="10" height="10" rx="2" fill="#c4b28a" opacity="0.35" transform="rotate(-18 275 387)"/>

  <!-- the extracted block: well clear of the wall, notch at the head -->
  <rect x="214" y="120" width="60" height="220" rx="5" fill="#c4b28a"/>
  <rect x="228" y="152" width="32" height="7" rx="3.5" fill="#181616"/>
  <line x1="228" y1="208" x2="260" y2="208" stroke="#181616" stroke-width="5" opacity="0.55"/>
  <line x1="228" y1="234" x2="260" y2="234" stroke="#181616" stroke-width="5" opacity="0.55"/>
  <line x1="228" y1="260" x2="260" y2="260" stroke="#181616" stroke-width="5" opacity="0.55"/>
</svg>
